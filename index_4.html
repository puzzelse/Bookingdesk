<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BookingDesk</title>
<style>
  :root {
    --bg: #f4f6f9; --panel: #ffffff; --ink: #1b2430; --muted: #66748a; --line: #e2e7ee;
    --brand: #0f6e8c; --brand-ink: #ffffff; --brand-soft: #e3f2f7;
    --ok: #1f8a4c; --ok-soft: #e2f4ea; --warn: #b26b00; --warn-soft: #fff1d9; --flash: #fff6c7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10151c; --panel:#18202a; --ink:#e8edf3; --muted:#93a1b5; --line:#2a3544;
      --brand:#4fb3d1; --brand-ink:#08222c; --brand-soft:#17323d; --ok:#5cc88a; --ok-soft:#173326;
      --warn:#f0b24c; --warn-soft:#3a2c12; --flash:#3d3714; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { background:var(--panel); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .logo { font-weight:700; font-size:18px; letter-spacing:.2px; display:flex; align-items:center; gap:8px; }
  .logo i { width:26px; height:26px; border-radius:7px; background:var(--brand); display:inline-block; position:relative; }
  .logo i::after { content:""; position:absolute; inset:7px 6px; border:2px solid var(--brand-ink); border-radius:3px; }
  .search { flex:1; min-width:220px; max-width:460px; display:flex; gap:8px; }
  input, select { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  input:focus, select:focus, button:focus-visible { outline:2px solid var(--brand); outline-offset:1px; }
  .search input { flex:1; }
  button { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:8px 12px; }
  button.primary { background:var(--brand); color:var(--brand-ink); border-color:var(--brand); font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .status { margin-left:auto; display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px var(--ok-soft); }
  .dot.off { background:var(--warn); box-shadow:0 0 0 3px var(--warn-soft); }
  .banner { background:var(--warn-soft); color:var(--warn); padding:8px 16px; font-size:13px; border-bottom:1px solid var(--line); }
  main { display:grid; grid-template-columns:320px 1fr; gap:16px; padding:16px; max-width:1200px; margin:0 auto; }
  @media (max-width:820px) { main { grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; }
  .list h2, .detail h2 { margin:0; font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); padding:14px 16px 8px; }
  .item { padding:12px 16px; border-top:1px solid var(--line); cursor:pointer; }
  .item:hover { background:var(--bg); }
  .item.sel { background:var(--brand-soft); box-shadow:inset 3px 0 0 var(--brand); }
  .item .ref { font-weight:600; }
  .item .sub { color:var(--muted); font-size:13px; }
  .empty { padding:24px 16px; color:var(--muted); }
  .detail { padding-bottom:8px; }
  .dhead { padding:4px 20px 16px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .dhead .title { font-size:22px; font-weight:700; margin:0; }
  .pill { display:inline-block; font-size:12px; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--ok-soft); color:var(--ok); }
  .facts { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; padding:0 20px 16px; }
  .pill.warn { background:var(--warn-soft); color:var(--warn); }
  .fact small { display:block; color:var(--muted); font-size:12px; }
  .section { border-top:1px solid var(--line); padding:14px 20px; }
  .section h3 { margin:0 0 10px; font-size:14px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-weight:600; color:var(--muted); font-size:12px; padding:6px 8px 6px 0; }
  td { padding:9px 8px 9px 0; border-top:1px solid var(--line); vertical-align:top; }
  .bag { display:inline-block; background:var(--brand-soft); color:var(--brand); border-radius:6px; padding:2px 8px; margin:0 6px 4px 0; font-size:13px; font-weight:600; }
  .none { color:var(--muted); }
  .bag.item { background:var(--warn-soft); color:var(--warn); }
  .tag { font-size:11px; font-weight:600; padding:1px 7px; border-radius:999px; background:var(--warn-soft); color:var(--warn); margin-left:4px; }
  #list { max-height:calc(100vh - 190px); overflow-y:auto; }
  @media (max-width:820px) { #list { max-height:360px; } }
  tr.flash td { animation:flash 3s ease-out; }
  @keyframes flash { 0%,60% { background:var(--flash); } 100% { background:transparent; } }
  .log li { padding:6px 0; border-top:1px solid var(--line); font-size:14px; list-style:none; }
  .log { margin:0; padding:0; }
  .log .src { color:var(--muted); font-size:12px; }
  .add { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .toast { position:fixed; right:16px; bottom:16px; background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:10px; max-width:340px; transform:translateY(20px); opacity:0; transition:.25s; pointer-events:none; }
  .toast.show { transform:none; opacity:1; }
  .pax { padding:12px 0; border-top:1px solid var(--line); }
  .pax:first-of-type { border-top:0; padding-top:0; }
  .pax.flash { animation:flash 3s ease-out; }
  .pax .who { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; align-items:baseline; }
  .pax .bags { margin:6px 0 8px; }
  .pax select { flex:1; min-width:180px; }
  .price { font-size:13px; margin-top:6px; color:var(--muted); }
  .price strong { color:var(--ink); font-size:15px; }
  body.embedded main { grid-template-columns:1fr; padding:10px; gap:10px; }
  body.embedded header { padding:8px 10px; gap:10px; }
  body.embedded #list { max-height:240px; }
  body.embedded footer { padding-bottom:12px; }
  .handoff { background:var(--brand-soft); border-bottom:1px solid var(--line); padding:10px 16px; font-size:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .handoff[hidden] { display:none; }
  .handoff strong { color:var(--brand); }
  .handoff button { margin-left:auto; padding:3px 10px; font-size:13px; }
  @media (max-width:520px) { .search { max-width:none; flex-basis:100%; } .status { margin-left:0; } }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:8px 16px 24px; }
  footer a { color:inherit; }
</style>
</head>
<body>
<header>
  <div class="logo"><i></i> BookingDesk</div>
  <form class="search" id="searchForm">
    <input id="q" type="search" placeholder="Search by surname or booking number" aria-label="Search by surname or booking number" autocomplete="off">
    <button class="primary" type="submit">Search</button>
  </form>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
</header>
<div class="banner" id="banner" hidden></div>
<div class="handoff" id="handoff" hidden></div>

<main>
  <section class="card list">
    <h2 id="listTitle">Bookings</h2>
    <div id="list"></div>
  </section>
  <section class="card detail" id="detail"><div class="empty">Select a booking.</div></section>
</main>
<footer>
  Demo system with synthetic data. <a href="#" id="resetLink">Reset demo data</a>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

  ]

function mockCall(action, p) {
  if (action === 'list') return {success:true, bookings: mock.bookings};
  if (action === 'catalog') return Object.assign({success:true}, DEFAULT_CATALOG);
  if (action === 'setHandoff') { mock.handoff = {id:'HO-'+Math.random().toString(36).slice(2,8).toUpperCase(), ref:p.ref||'', surname:p.surname||'', request:p.request||'', source:'Virtual agent (chat)', createdAt:new Date().toISOString()}; return {success:true, handoffId:mock.handoff.id}; }
  if (action === 'getHandoff') return {success:true, handoff: mock.handoff || null};
  if (action === 'lookup') { var n=(p.surname||'').toLowerCase().trim(); var all=mock.bookings; var m=all.filter(function(b){var r=b.ref.toLowerCase();return r===n||(n.length>=4&&r.indexOf(n)!==-1);}); if(!m.length) m=all.filter(function(b){return b.leadSurname.toLowerCase()===n||b.customerId.toLowerCase()===n||b.passengers.some(function(x){return x.surname.toLowerCase()===n;});}); return {success:true,found:m.length>0,count:m.length,bookings:m}; }
  if (action === 'addLuggage') {
    var b = mock.bookings.filter(function(x){return x.ref===p.ref;})[0]; if(!b) return {success:false,error:'Booking not found'};
    var px = b.passengers.filter(function(x){return x.passengerId===p.passengerId;})[0]; if(!px) return {success:false,error:'Passenger not found'};
    var entry, id='HL-'+Math.random().toString(36).slice(2,8).toUpperCase();
    if (p.item) { var it=DEFAULT_CATALOG.items.filter(function(x){return x.key===p.item;})[0]; if(!it) return {success:false,error:'Unknown item'};
      entry={luggageId:id,itemKey:it.key,itemLabel:it.label,weightKg:null,pieces:1,price:it.price,currency:'EUR',addedBy:p.source||'Agent desk (UI)',addedAt:new Date().toISOString()}; }
    else { var w = Number(p.weightKg); if(!PRICES[w]) return {success:false,error:'Invalid weight'};
      entry={luggageId:id,itemKey:'hold-'+w,itemLabel:w+'kg hold bag',weightKg:w,pieces:1,price:PRICES[w],currency:'EUR',addedBy:p.source||'Agent desk (UI)',addedAt:new Date().toISOString()}; }
    px.holdLuggage.push(entry);
    return {success:true,confirmationRef:id,message:'Added'};
  }
  if (action === 'resetDemo') { mock.handoff = null; mock.bookings.forEach(function(b){b.passengers.forEach(function(x){x.holdLuggage=[];});}); return {success:true}; }
  return {success:false,error:'Unknown action'};
}

/* ===== API wrapper ===== */
async function api(action, params, post) {
  params = params || {};
  if (!API_URL) return mockCall(action, params);
  if (post) {
    var res = await fetch(API_URL, { method:'POST', body: JSON.stringify(Object.assign({action:action}, params)) });
    return res.json();
  }
  var u = new URL(API_URL); u.searchParams.set('action', action);
  Object.keys(params).forEach(function(k){ u.searchParams.set(k, params[k]); });
  var r = await fetch(u.toString()); return r.json();
}

/* ===== State ===== */
var state = { handoffId:'', suggestItem:'', lastJson:'', query:'', bookings:[], selected:null, seen:{}, catalog:null, autoSelectSingle:false };

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fmtDate(iso){ var d=new Date(iso+'T00:00:00Z'); return isNaN(d)?iso:d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}); }
function fmtTime(iso){ var d=new Date(iso); return isNaN(d)?'':d.toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
function allBags(b){ var out=[]; b.passengers.forEach(function(p){ p.holdLuggage.forEach(function(l){ out.push(Object.assign({passenger:p.fullName,passengerId:p.passengerId},l)); }); }); return out; }
function money(n){ return '€' + Number(n).toFixed(2); }
function bagLabel(l){ return l.itemLabel || (l.weightKg ? l.weightKg + 'kg hold bag' : 'Hold bag'); }
function catalog(){ return state.catalog || DEFAULT_CATALOG; }
function optionList(){
  var c = catalog();
  return '<optgroup label="Hold bag">' + c.holdBags.map(function(h){ return '<option value="hold:'+h.weightKg+'" data-price="'+h.price+'">'+h.weightKg+'kg hold bag · '+money(h.price)+'</option>'; }).join('') + '</optgroup>'
       + '<optgroup label="Oversized and special items">' + c.items.map(function(i){ return '<option value="item:'+esc(i.key)+'" data-price="'+i.price+'">'+esc(i.label)+' · '+money(i.price)+'</option>'; }).join('') + '</optgroup>';
}
function priceLine(price){ return 'Price: <strong>' + money(price) + '</strong>' + (Number(price)===0 ? ' <span class="none">(no charge)</span>' : ' <span class="none">per piece</span>'); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');},3500); }
function setStatus(ok, text){ document.getElementById('dot').className='dot'+(ok?'':' off'); document.getElementById('statusText').textContent=text; }

/* ===== Load + render ===== */
async function load(silent) {
  try {
    var res = state.query ? await api('lookup',{surname:state.query}) : await api('list');
    if (!res.success) throw new Error(res.error||'API error');
    var fresh = res.bookings || [];
    detectNewBags(fresh, silent);
    state.bookings = fresh;
    if (state.selected && !fresh.some(function(b){return b.ref===state.selected;})) state.selected = null;
    if (state.autoSelectSingle && fresh.length === 1) state.selected = fresh[0].ref;
    state.autoSelectSingle = false;
    var sig = JSON.stringify(fresh) + '|' + state.selected;
    var changed = sig !== state.lastJson; state.lastJson = sig;
    if (changed || !silent) render();
    setStatus(true, API_URL ? 'Live · updated ' + new Date().toLocaleTimeString('en-GB') : 'Offline preview');
  } catch (e) {
    setStatus(false, 'Cannot reach API');
    if (!silent) toast('Could not load bookings: ' + e.message);
  }
}

function detectNewBags(fresh, silent) {
  fresh.forEach(function(b){ allBags(b).forEach(function(l){
    if (!state.seen[l.luggageId]) {
      state.seen[l.luggageId] = true;
      if (silent && state._primed && l.addedBy.toLowerCase().indexOf('agent desk')<0) toast('Update received: ' + bagLabel(l) + ' added for ' + l.passenger + ' on ' + b.ref + ' (' + l.addedBy + ')');
      if (state._primed) state.flash = l.luggageId;
    }
  });});
  state._primed = true;
}

// Work out which catalogue item a free-text request is about, so the drop-down can be pre-selected
function suggestItem(text) {
  var t = String(text || '').toLowerCase();
  var map = [['diving','div|scuba|snorkel'],['bike','bike|bicycle|cycle'],['skis','\\bski'],['snowboard','snowboard'],['instrument','instrument|guitar|violin|cello|keyboard|saxophone|trumpet'],['medical','medical|wheelchair|oxygen|mobility|cpap|dialysis']];
  for (var i=0;i<map.length;i++) { if (new RegExp(map[i][1]).test(t)) return 'item:' + map[i][0]; }
  return '';
}

function showHandoff(h) {
  var el = document.getElementById('handoff');
  var who = h.ref ? 'booking <strong>' + esc(h.ref) + '</strong>' : 'surname <strong>' + esc(h.surname) + '</strong>';
  el.innerHTML = '<span>Handed off from the virtual agent for ' + who + (h.request ? ' · Customer request: <strong>' + esc(h.request) + '</strong>' : '') + '</span><button type="button" id="handoffClose">Dismiss</button>';
  el.hidden = false;
  document.getElementById('handoffClose').onclick = function(){ el.hidden = true; };
}

// The virtual agent records a handoff in BookingDesk; the widget picks up the latest one and opens that booking
async function checkHandoff() {
  try {
    var res = await api('getHandoff', {maxAgeMinutes: 30});
    var h = res && res.success ? res.handoff : null;
    if (!h || h.id === state.handoffId) return;
    state.handoffId = h.id;
    state.query = (h.ref || h.surname || '').trim();
    document.getElementById('q').value = state.query;
    state.suggestItem = suggestItem(h.request);
    state.autoSelectSingle = true;
    state.lastJson = '';
    showHandoff(h);
    await load(false);
  } catch (e) { /* the handoff check is best-effort */ }
}

function updatePrice(sel) {
  var opt = sel.options[sel.selectedIndex]; if (!opt) return;
  var line = document.querySelector('[data-price-for="'+sel.dataset.pid+'"]');
  if (line) line.innerHTML = priceLine(opt.getAttribute('data-price'));
}

function render() {
  // Remember what the agent has chosen in each baggage drop-down so a redraw never resets it
  var keep = {};
  document.querySelectorAll('select[data-pid]').forEach(function(sel){ keep[sel.dataset.pid] = sel.value; });
  document.getElementById('listTitle').textContent = state.query ? 'Results for “' + state.query + '”' : 'All bookings';
  var list = document.getElementById('list');
  if (!state.bookings.length) { list.innerHTML = '<div class="empty">No bookings found.</div>'; }
  else list.innerHTML = state.bookings.map(function(b){
    return '<div class="item'+(b.ref===state.selected?' sel':'')+'" data-ref="'+esc(b.ref)+'" tabindex="0"><div class="ref">'+esc(b.ref)+' · '+esc(b.destination)+'</div><div class="sub">'+esc(b.leadName)+' · departs '+esc(fmtDate(b.departDate))+'</div></div>';
  }).join('');
  var b = state.bookings.filter(function(x){return x.ref===state.selected;})[0];
  document.getElementById('detail').innerHTML = b ? detailHtml(b) : '<div class="empty"><strong>No booking selected</strong><br>Choose a booking from the list to see its details.</div>';
  Object.keys(keep).forEach(function(pid){
    var sel = document.querySelector('select[data-pid="'+pid+'"]');
    if (sel) { sel.value = keep[pid]; updatePrice(sel); }
  });
  if (state.suggestItem) {
    document.querySelectorAll('select[data-pid]').forEach(function(sel){
      if (keep[sel.dataset.pid] === undefined && Array.prototype.some.call(sel.options, function(o){return o.value===state.suggestItem;})) { sel.value = state.suggestItem; updatePrice(sel); }
    });
  }
  state.flash = null;
}

function detailHtml(b) {
  var rows = b.passengers.map(function(p){
    var bags = p.holdLuggage.length ? p.holdLuggage.map(function(l){ return '<span class="bag'+(l.itemKey && l.itemKey.indexOf('hold-')!==0 && l.itemKey ? ' item' : '')+'">'+esc(l.pieces)+' × '+esc(bagLabel(l))+'</span>'; }).join('') : '<span class="none">Cabin bag only</span>';
    var flashing = p.holdLuggage.some(function(l){return l.luggageId===state.flash;});
    var firstPrice = catalog().holdBags[0].price;
    return '<div class="pax'+(flashing?' flash':'')+'"><div class="who"><strong>'+esc(p.fullName)+'</strong><span class="none">'+esc(p.type)+' · '+esc(p.passengerId)+'</span></div><div class="bags">'+bags+'</div>'
      + '<div class="add"><select data-pid="'+esc(p.passengerId)+'" aria-label="Baggage to add for '+esc(p.fullName)+'">'+optionList()+'</select><button data-add="'+esc(p.passengerId)+'">Add</button></div>'
      + '<div class="price" data-price-for="'+esc(p.passengerId)+'">'+priceLine(firstPrice)+'</div></div>';
  }).join('');
  var bags = allBags(b).sort(function(a,c){return String(c.addedAt).localeCompare(String(a.addedAt));});
  var log = bags.length ? '<ul class="log">'+bags.map(function(l){
    return '<li><strong>'+esc(bagLabel(l))+'</strong> added for '+esc(l.passenger)+' · €'+esc(Number(l.price).toFixed(2))+' · <span class="none">'+esc(l.luggageId)+'</span><div class="src">'+esc(l.addedBy)+' · '+esc(fmtTime(l.addedAt))+'</div></li>';
  }).join('')+'</ul>' : '<div class="none">No baggage activity yet.</div>';
  return '<h2>Booking</h2><div class="dhead"><div><p class="title">'+esc(b.ref)+' · '+esc(b.destination)+'</p><div class="none">'+esc(b.brand)+' · Lead traveller: '+esc(b.leadName)+' · '+esc(b.customerId)+'</div></div><div><span class="pill'+(b.status==='Confirmed'?'':' warn')+'">'+esc(b.status)+'</span></div></div>'
   + '<div class="facts"><div class="fact"><small>Product</small>'+esc(b.product)+'</div><div class="fact"><small>Accommodation</small>'+esc(b.accommodation)+'</div><div class="fact"><small>Departs</small>'+esc(fmtDate(b.departDate))+'</div><div class="fact"><small>Returns</small>'+esc(fmtDate(b.returnDate))+'</div><div class="fact"><small>Travellers</small>'+esc(b.travellers)+'</div><div class="fact"><small>Total price</small>€'+esc(Number(b.totalPrice).toLocaleString('en-GB'))+'</div><div class="fact"><small>Booked via</small>'+esc(b.bookedVia)+'</div></div>'
   + '<div class="section"><h3>Passengers and baggage</h3>'+rows+'</div>'
   + '<div class="section"><h3>Baggage activity</h3>'+log+'</div>';
}

/* ===== Events ===== */
document.getElementById('searchForm').addEventListener('submit', function(e){ e.preventDefault(); state.query = document.getElementById('q').value.trim(); load(false); });
document.getElementById('list').addEventListener('click', function(e){ var it=e.target.closest('.item'); if(it){ state.selected=it.dataset.ref; render(); if(window.innerWidth<=820) document.getElementById('detail').scrollIntoView({behavior:'smooth'}); } });
document.getElementById('list').addEventListener('keydown', function(e){ if(e.key==='Enter'){ var it=e.target.closest('.item'); if(it){ state.selected=it.dataset.ref; render(); } } });
document.getElementById('detail').addEventListener('click', async function(e){
  var btn = e.target.closest('button[data-add]'); if(!btn) return;
  var pid = btn.dataset.add, sel = document.querySelector('select[data-pid="'+pid+'"]');
  btn.disabled = true;
  try {
    var parts = sel.value.split(':'), payload = {ref:state.selected, passengerId:pid, source:'Agent desk (UI)'};
    if (parts[0] === 'item') payload.item = parts[1]; else payload.weightKg = parts[1];
    var res = await api('addLuggage', payload, true);
    if (!res.success) throw new Error(res.error);
    toast((res.itemLabel || 'Bag') + ' added. Confirmation ' + res.confirmationRef); await load(false);
  } catch(err) { toast('Could not add item: ' + err.message); btn.disabled = false; }
});
document.getElementById('detail').addEventListener('change', function(e){
  var sel = e.target.closest('select[data-pid]'); if(!sel) return;
  updatePrice(sel);
});
document.getElementById('resetLink').addEventListener('click', async function(e){
  e.preventDefault(); await api('resetDemo', {}, true); state.seen = {}; state._primed = false; toast('Demo data reset'); load(false);
});

if (!API_URL) { var bn=document.getElementById('banner'); bn.hidden=false; bn.textContent='Offline preview: no API configured, showing built-in sample data. Set API_URL in index.html or open with ?api=<web app URL>.'; }
if (window.self !== window.top || qs.get('embed')) document.body.classList.add('embedded');
(async function init(){
  try { var c = await api('catalog'); if (c && c.success && c.items) state.catalog = c; } catch(e) {}
  // Handoff: the chat can open the widget with ?surname=Peeters (or ?q= / ?ref=) so the customer's bookings are already loaded
  var pre = qs.get('surname') || qs.get('q') || qs.get('ref') || '';
  if (pre) { state.query = pre.trim(); document.getElementById('q').value = state.query; state.autoSelectSingle = true; }
  if (pre) load(false); else await checkHandoff().then(function(){ if (!state.bookings.length) return load(false); });
})();
setInterval(function(){ if (!document.hidden) { load(true); checkHandoff(); } }, POLL_MS);
</script>
<script>
/* Puzzel Widget API handshake (lets the page screen-pop inside the Puzzel agent application) */
const ORIGIN = 'https://agent.puzzel.com';
let port = null;
window.addEventListener('message', (e) => {
  if (e.origin !== ORIGIN) return;
  if (!port && e.ports?.[0]) {
    port = e.ports[0];
    port.onmessage = () => {};
    port.postMessage({ subscribe: 'requestAccepted' });
  }
});
</script>
